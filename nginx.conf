# nginx configuration for ViaKashmir Lead CRM
# Place this in /etc/nginx/sites-available/viakashmir-crm
# Then: sudo ln -s /etc/nginx/sites-available/viakashmir-crm /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect HTTP → HTTPS (uncomment after setting up SSL)
    # return 301 https://$host$request_uri;

    root /var/www/viakashmir-crm;
    index index.php;

    # ── Security Headers ──────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # ── Block sensitive files ─────────────────────────────────────────────
    location ~ ^/(config\.php|composer\.(json|lock)|cron\.php|\.git) {
        deny all;
        return 404;
    }
    location ~ ^/src/ { deny all; return 404; }
    location ~ ^/templates/ { deny all; return 404; }

    # ── Static files (CSS, JS) ────────────────────────────────────────────
    location /public/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Route everything else through index.php ───────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;  # adjust PHP version as needed
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60;
    }

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript application/json;

    # ── Logging ───────────────────────────────────────────────────────────
    access_log /var/log/nginx/viakashmir-crm.access.log;
    error_log  /var/log/nginx/viakashmir-crm.error.log;
}

